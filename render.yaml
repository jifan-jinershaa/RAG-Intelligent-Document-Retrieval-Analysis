services:
  # ------------------------------------------------------------------
  # 1. Backend Web Service: FastAPI + ChromaDB + BM25 + PyMuPDF
  # ------------------------------------------------------------------
  - type: web
    name: raglab-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEFAULT_GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      # Optional: To use a Render persistent disk, attach disk at /var/data and uncomment:
      # - key: DATA_PATH
      #   value: /var/data

  # ------------------------------------------------------------------
  # 2. Frontend Static Site: React + TypeScript + Vite + Tailwind CSS
  # ------------------------------------------------------------------
  - type: web
    name: raglab-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA rewrite rule so page refresh and deep routes do not 404
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: raglab-backend
          property: host
